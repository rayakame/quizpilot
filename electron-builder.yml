appId: io.github.rayakame.quizpilot
productName: QuizPilot
artifactName: ${productName}-${arch}.${ext}
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/icon.png
  - package.json
asarUnpack:
  - "**/node_modules/sharp/**/*"
  - "**/node_modules/@img/**/*"
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.utilities
  icon: resources/icon.png
  # Ad hoc only: Apple Silicon refuses to start unsigned code, and there is no developer ID.
  identity: "-"
  hardenedRuntime: false
  notarize: false
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  artifactName: ${productName}-Setup.${ext}
  oneClick: true
  perMachine: false
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
  icon: resources/icon.png
appImage:
  artifactName: ${productName}-${arch}.${ext}
publish:
  provider: github
  owner: rayakame
  repo: quizpilot
  releaseType: draft
