name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 0.2.0
        required: true
      publish:
        description: Publish right away instead of leaving a draft
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency: release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set the version
        id: version
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo "Start releases from main."; exit 1; }
          pnpm exec tsx scripts/release-version.ts "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches package.json
        if: github.event_name == 'push'
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Commit and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUMP: ${{ steps.version.outputs.bump }}
        run: |
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          if [ "$BUMP" = true ]; then git commit -am "Release $VERSION"; fi
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"
      - id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$VERSION" ]; then tag="v$VERSION"; else tag="$GITHUB_REF_NAME"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # Three jobs creating the release at once can end up with two drafts.
  draft:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" ||
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft
          --title "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}

  build:
    needs: [prepare, draft]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [prepare, build]
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
