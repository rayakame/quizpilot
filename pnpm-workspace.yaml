packages:
  - site
allowBuilds:
  "@google/genai": false
  electron-winstaller: false
  esbuild: true
  protobufjs: false
minimumReleaseAgeExclude:
  - "@typesafe-ai/sdk@0.7.0"
  - "@astrojs/internal-helpers@0.13.0"
  - "@astrojs/markdown-satteri@0.4.4"
  - "@astrojs/prism@4.1.0"
  - "@astrojs/telemetry@3.4.0"
  - astro@7.4.0
supportedArchitectures:
  os: [current]
  cpu: [current, x64]
